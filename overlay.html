<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamFX Live - Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #alert-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .alert-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeInOut 4s ease-in-out forwards;
            opacity: 0;
        }

        .alert-image {
            max-width: 350px;
            max-height: 350px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
            margin-bottom: 15px;
        }

        .alert-text-card {
            background: rgba(18, 18, 18, 0.85);
            border: 2px solid #fe2c55;
            padding: 12px 25px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .alert-username {
            font-size: 24px;
            font-weight: 800;
            color: #25f4ee;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .alert-message {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        @keyframes fadeInOut {
            0% { transform: scale(0.7); opacity: 0; }
            15% { transform: scale(1); opacity: 1; }
            85% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="alert-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const alertContainer = document.getElementById('alert-container');
        
        let alertQueue = [];
        let isPlaying = false;

        socket.on('trigger_alert', (data) => {
            alertQueue.push(data);
            processQueue();
        });

        function processQueue() {
            if (isPlaying || alertQueue.length === 0) return;
            isPlaying = true;

            const alertData = alertQueue.shift();
            showAlert(alertData);
        }

        function showAlert(data) {
            // Clear container
            alertContainer.innerHTML = '';

            const box = document.createElement('div');
            box.className = 'alert-box';

            // Add image if URL exists
            if (data.imageUrl && data.imageUrl.trim() !== '') {
                const img = document.createElement('img');
                img.src = data.imageUrl;
                img.className = 'alert-image';
                // Fallback if image fails to load
                img.onerror = () => { img.style.display = 'none'; };
                box.appendChild(img);
            }

            // Text Card
            const textCard = document.createElement('div');
            textCard.className = 'alert-text-card';

            const userDiv = document.createElement('div');
            userDiv.className = 'alert-username';
            userDiv.innerText = `@${data.username}`;
            textCard.appendChild(userDiv);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'alert-message';
            msgDiv.innerText = data.text;
            textCard.appendChild(msgDiv);

            box.appendChild(textCard);
            alertContainer.appendChild(box);

            // Play sound if assigned
            if (data.soundUrl) {
                const audio = new Audio(data.soundUrl);
                audio.play().catch(e => console.log("Audio play blocked or missing:", e));
            }

            // Remove box after animation completes (4 seconds)
            setTimeout(() => {
                alertContainer.innerHTML = '';
                isPlaying = false;
                processQueue(); // process next in queue
            }, 4000);
        }
    </script>
</body>
</html>
